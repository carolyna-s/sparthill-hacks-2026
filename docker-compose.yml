# Optional: run the app against Postgres locally, the way it runs on AWS.
# docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mentorship
      POSTGRES_PASSWORD: mentorship
      POSTGRES_DB: mentorship
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mentorship:mentorship@db:5432/mentorship
    ports: ["8000:8000"]
    depends_on: [db]

volumes:
  pgdata:
