{% extends "base.html" %}
{% block content %}
<div class="py-16 text-center">
  <h1 class="text-4xl font-bold mb-4">Mentorship that actually happens</h1>
  <p class="text-slate-600 max-w-xl mx-auto mb-8">Apply, get matched with a mentor who fits your goals, and stay on track
    with sessions, prework, check-ins, and messaging in one place.</p>
  <div class="flex justify-center gap-3">
    <a href="{{ url_for('auth.register', role='mentee') }}" class="bg-indigo-600 text-white rounded px-5 py-2.5">Apply as a mentee</a>
    <a href="{{ url_for('auth.register', role='mentor') }}" class="border rounded px-5 py-2.5 bg-white">Become a mentor</a>
  </div>
</div>
{% endblock %}
